<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SaveGuardian · 存档守护</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="ember"></div>
  <header class="topbar">
    <div class="brand">
      <span class="flame">✦</span>
      <h1>SAVE<span>GUARDIAN</span></h1>
    </div>
    <div class="controls">
      <label class="field">
        <span>游戏档案</span>
        <select id="gameSelect"></select>
      </label>
      <button id="manageGamesBtn" class="ghost">管理档案</button>
      <button id="settingsBtn" class="ghost">设置</button>
      <a class="github-link" href="https://github.com/nanocm/save-guardian" target="_blank" rel="noopener" title="在 GitHub 上查看">GitHub ↗</a>
    </div>
  </header>

  <main>
    <section class="actionbar">
      <input id="noteInput" type="text" maxlength="120" placeholder="备份备注（可选）——例如：打Boss前" />
      <button id="backupBtn" class="primary">立即备份</button>
      <button id="undoBtn" class="ghost" hidden title="恢复到最近一次“恢复前安全快照”">↩ 撤销上次恢复</button>
      <span id="hotkeyHint" class="hint"></span>
    </section>

    <section class="statsbar" id="statsbar" hidden>
      <div class="stats" id="stats"></div>
      <div class="legend" title="备份类型">
        <span class="lg lg-manual">手动</span>
        <span class="lg lg-hotkey">热键</span>
        <span class="lg lg-pre-restore">安全快照</span>
      </div>
    </section>

    <section class="listwrap">
      <div class="list-head">
        <div class="lh-left">
          <h2>备份记录</h2>
          <label class="selall"><input type="checkbox" id="selectAll" /> 全选</label>
        </div>
        <div class="lh-right">
          <button id="deleteSelectedBtn" class="danger small" hidden>删除选中 (0)</button>
          <button id="refreshBtn" class="ghost small">刷新</button>
        </div>
      </div>

      <div class="filterbar">
        <input id="filterInput" type="text" placeholder="搜索备注 / 时间…" aria-label="搜索备份" />
        <div class="chips" id="typeChips" role="group" aria-label="按类型筛选">
          <button class="chip active" data-type="all">全部</button>
          <button class="chip" data-type="manual">手动</button>
          <button class="chip" data-type="hotkey">热键</button>
          <button class="chip" data-type="pre-restore">安全快照</button>
        </div>
      </div>

      <div id="backupList" class="backup-list"></div>
      <div id="loading" class="loading" hidden aria-hidden="true">
        <div class="sk"></div><div class="sk"></div><div class="sk"></div>
      </div>
      <p id="emptyHint" class="empty" hidden>还没有备份。点击「立即备份」或按热键创建第一个。</p>
      <p id="noMatch" class="empty" hidden>没有匹配的备份。试试清空搜索或切换类型。</p>
    </section>

    <footer class="site-footer">
      <span>SaveGuardian · 存档守护</span>
      <span class="sep">·</span>
      <span>MIT License</span>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Manage games modal -->
  <div id="gamesModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="gamesTitle" hidden>
    <div class="modal-card">
      <h3 id="gamesTitle">管理游戏档案</h3>
      <div id="gamesTable" class="games-table"></div>
      <hr />
      <h4>新增 / 更新档案</h4>
      <label class="field block"><span>档案名称</span>
        <input id="gName" type="text" placeholder="例如 Project Plague" />
      </label>
      <label class="field block"><span>要备份的文件夹（这个文件夹会被整体备份）</span>
        <div class="path-row">
          <input id="gSource" type="text" placeholder="例如 C:\\Users\\...\\GameSlots\\maingame1" />
          <button data-pick="gSource" class="ghost small">选择…</button>
        </div>
      </label>
      <label class="field block"><span>备份目标目录</span>
        <div class="path-row">
          <input id="gBackup" type="text" placeholder="D:\\MySaveBackups\\..." />
          <button data-pick="gBackup" class="ghost small">选择…</button>
        </div>
      </label>
      <div class="modal-actions">
        <button id="saveGameBtn" class="primary">保存档案</button>
        <button id="closeGamesBtn" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <!-- Restore confirm modal -->
  <div id="restoreModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="restoreTitle" hidden>
    <div class="modal-card">
      <h3 id="restoreTitle">恢复到此备份？</h3>
      <p class="warn">请先在游戏里 <b>退回到标题界面</b>（无需完全退出）。恢复前会自动为当前存档创建一次安全快照。</p>
      <p id="restoreTarget" class="mono"></p>
      <div class="modal-actions">
        <button id="confirmRestoreBtn" class="danger">确认恢复</button>
        <button id="cancelRestoreBtn" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="modal-card">
      <h3 id="settingsTitle">设置</h3>
      <label class="field block"><span>全局备份热键</span>
        <input id="hkInput" type="text" placeholder="点此按下组合键，或手动输入，如 Ctrl+Alt+S" />
      </label>
      <p class="hint">聚焦输入框后直接按下组合键即可录制。支持 Ctrl / Alt / Shift / Win 组合 + 字母 / 数字 / F1~F12。保存后立即尝试生效，若失败会提示重启。</p>
      <div class="modal-actions">
        <button id="saveHotkeyBtn" class="primary">保存热键</button>
        <button id="closeSettingsBtn" class="ghost">关闭</button>
      </div>
    </div>
  </div>

  <!-- Generic confirm modal -->
  <div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="modal-card">
      <h3 id="confirmTitle">确认操作</h3>
      <p id="confirmMsg" class="warn"></p>
      <div class="modal-actions">
        <button id="confirmOkBtn" class="danger">确认</button>
        <button id="confirmCancelBtn" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
