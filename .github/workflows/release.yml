name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

      - name: Build Windows executable
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o SaveGuardian.exe .

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: SaveGuardian.exe
          generate_release_notes: true
